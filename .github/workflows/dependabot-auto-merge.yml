name: Dependabot auto-merge

# Enables auto-merge on low-risk Dependabot PRs so they merge themselves once the
# required checks pass (branch protection still gates the actual merge). Higher-risk
# updates are left for manual review:
#   - github-actions: any update (SHA-pinned, small blast radius).
#   - cargo: patch/minor only, and never the candle/tokenizers ML deps — their
#     real-model runtime behavior is not exercised by the per-push CI, so a human
#     reviews those even though the real-embedder-check job now compiles them.
# Major cargo bumps always require manual review.
on: pull_request

permissions:
  contents: write # enable auto-merge on the PR
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2

      - name: Enable auto-merge for low-risk updates
        if: >-
          steps.meta.outputs.package-ecosystem == 'github_actions' ||
          (
            contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.meta.outputs.update-type) &&
            !contains(steps.meta.outputs.dependency-names, 'candle') &&
            !contains(steps.meta.outputs.dependency-names, 'tokenizers')
          )
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
