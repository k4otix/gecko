name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      typedb:
        image: typedb/typedb:latest
        ports:
          - 1729:1729

    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: rustfmt, clippy
        
    - name: Install nextest, cargo-audit, and cargo-outdated
      uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2
      with:
        tool: nextest,cargo-audit,cargo-outdated
        
    - name: Rust Cache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      
    - name: Check Formatting
      run: cargo fmt --all -- --check
      
    - name: Run Cargo Audit
      run: cargo audit
      
    - name: Build
      # --workspace --all-targets so this compiles the same feature-unified graph
      # (dev-dependencies included) that the test step needs — otherwise the test
      # step recompiles ~120 crates that differ only in feature resolution.
      run: cargo build --workspace --all-targets --verbose
      
    - name: Run Tests
      run: cargo nextest run --workspace
