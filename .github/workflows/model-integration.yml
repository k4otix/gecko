name: Model Integration

# Tier 3: the real embedding model, real TypeDB, the actual quality assertions
# (semantic-relevance ranking, not just shape checks). Deliberately NOT run on
# every push, and NOT on a schedule — manual dispatch only, so the 1.3GB model is
# fetched only when a human is validating (model bump / release / embedder change)
# and is then served from an immutable, revision-keyed cache (plan P5). A paths-
# filtered `pull_request` trigger for the embedder surface is the intended add once
# the repo is public (external PRs whose local Tier-3 runs can't be trusted).
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Full HuggingFace repo id INCLUDING the org — the fetch resolves
  # `huggingface.co/{MODEL_ID}/resolve/{MODEL_REVISION}/...`, and the bare
  # `bge-large-en-v1.5` (no org) 401s. Kept in lockstep with `default_model_id()`.
  MODEL_ID: BAAI/bge-large-en-v1.5
  # IMMUTABLE pinned revision — a HuggingFace commit SHA, NEVER `main` (plan P2
  # note: `@main` is a moving target and defeats the cache key). Resolved
  # 2026-07-09 via `curl https://huggingface.co/api/models/BAAI/bge-large-en-v1.5`
  # (the `sha` field). Bumping this value is the ONLY sanctioned way to move to
  # a new model revision, and per plan P5 requires a manual run of this
  # workflow (workflow_dispatch) to go green BEFORE the bump is merged — see
  # the `model-bump-gate` job in ci.yml, which fails a PR touching this value
  # unless it carries the `tier3-validated` label.
  MODEL_REVISION: d4aa6901d3a41ba39fb536a557fa166f842b0e09
  # Optional mirror (plan P2): prefer this over HuggingFace to avoid
  # rate-limit/uptime flakiness on the nightly job. Unset ⇒ fetch from HF
  # directly. Wire a `MODEL_MIRROR_URL` repo/environment secret to use one.
  # Hoisted to JOB level (not step-level) deliberately: a step's `if:` cannot
  # see env vars assigned in that same step's own `env:` block — only
  # job/workflow-level env is visible to a step's `if:` condition. Assigning it
  # here is what makes `if: ${{ env.MODEL_MIRROR_URL != '' }}` below actually work.
  MODEL_MIRROR_URL: ${{ secrets.MODEL_MIRROR_URL }}

jobs:
  tier3:
    name: Tier 3 (real model + real TypeDB)
    runs-on: ubuntu-latest

    services:
      typedb:
        image: typedb/typedb:3.12.0
        ports:
          - 1729:1729

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install nextest
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: nextest

      - name: Rust Cache
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      # The crux (plan P5): key the cache on the IMMUTABLE revision, not on
      # `main` or a date. Steady state (revision unchanged) is a cache
      # restore — no re-download — even on the nightly cadence. The key only
      # changes when MODEL_REVISION is deliberately bumped, invalidating the
      # cache exactly once.
      - name: Cache the model (keyed on the immutable revision)
        id: model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gecko/models
          key: model-${{ env.MODEL_ID }}-${{ env.MODEL_REVISION }}

      # Optional mirror wiring: only materializes a STANDALONE config override
      # when the secret is configured; otherwise `gecko model fetch` falls back
      # to HuggingFace directly (fetch.rs's DEFAULT_HF_BASE) using the
      # committed gecko.toml as-is.
      #
      # Deliberately NOT appended to the committed gecko.toml: that file
      # already ships a `[semantic_index]` table (repo root gecko.toml), and
      # TOML rejects a second `[semantic_index]` table in the same document —
      # `>> gecko.toml` here would corrupt it into an unparseable file. Instead
      # write a COMPLETE, standalone config to $RUNNER_TEMP and point `gecko
      # --config` at it, leaving the committed gecko.toml untouched.
      - name: Configure model mirror (optional)
        id: mirror-config
        if: ${{ env.MODEL_MIRROR_URL != '' }}
        run: |
          set -euo pipefail
          CONFIG_PATH="$RUNNER_TEMP/gecko.ci.toml"
          cat > "$CONFIG_PATH" <<EOF
          [extensions]
          enabled = ["cyber"]

          [typedb]
          endpoint = "localhost:1729"
          mode = "external"

          [semantic_index]
          enabled = true
          embedder = "stub"
          backend = "hnsw"
          model_id = "${MODEL_ID}@${MODEL_REVISION}"
          model_source = "${MODEL_MIRROR_URL}"
          EOF
          echo "config_path=$CONFIG_PATH" >> "$GITHUB_OUTPUT"
          echo "Wrote standalone mirror config to $CONFIG_PATH:"
          cat "$CONFIG_PATH"

      # Stage the model into the cache dir. Idempotent (fetch.rs::is_cached) —
      # a cache hit above makes this a no-op; a cache miss downloads the
      # 1.3GB once. `gecko model fetch` is candle-free itself (fetch.rs has no
      # candle dependency), so this step is cheap even before Tier-3 compiles.
      # Uses the standalone mirror config (above) only when the mirror secret
      # produced one; otherwise runs with the default (committed) gecko.toml,
      # which has no `model_source` set and so fetches from HuggingFace.
      - name: Stage the model (gecko model fetch)
        env:
          MIRROR_CONFIG: ${{ steps.mirror-config.outputs.config_path }}
        run: |
          set -euo pipefail
          if [ -n "${MIRROR_CONFIG:-}" ]; then
            echo "Using mirror config: $MIRROR_CONFIG"
            cargo run --quiet --bin gecko -- --config "$MIRROR_CONFIG" model fetch --model "${MODEL_ID}@${MODEL_REVISION}"
          else
            echo "No mirror configured — using default gecko.toml (HuggingFace fetch path)."
            cargo run --quiet --bin gecko -- model fetch --model "${MODEL_ID}@${MODEL_REVISION}"
          fi

      # Guard (plan P5 concern): the Tier-3 tests resolve GECKO_SMOKE_MODEL_DIR
      # and SILENTLY SKIP-GREEN when it's unset or the model isn't actually
      # there — acceptable for a default `cargo test --features
      # integration-model` compile+contract check, but NOT acceptable here.
      # Fail the job loudly instead of false-passing if staging didn't work.
      - name: Verify the staged model, and point tests at it
        run: |
          set -euo pipefail
          DIR="$HOME/.cache/gecko/models/${MODEL_ID}@${MODEL_REVISION}"
          if [ ! -f "$DIR/model.safetensors" ] || [ ! -f "$DIR/tokenizer.json" ] || [ ! -f "$DIR/config.json" ]; then
            echo "::error::Expected a fully staged model at $DIR (config.json, tokenizer.json, model.safetensors)."
            echo "::error::The fetch/cache step did not populate it — Tier-3 would silently skip-pass. Failing instead."
            exit 1
          fi
          echo "GECKO_SMOKE_MODEL_DIR=$DIR" >> "$GITHUB_ENV"
          echo "OK: staged model found at $DIR"

      # `--success-output final` prints captured stdout/stderr for PASSING
      # tests too (nextest defaults to only showing failures), so the guard
      # below can see the tests' own "unset — skipping" canary if it fires.
      - name: Run Tier-3 (real embedder + real TypeDB)
        run: |
          set -euo pipefail
          cargo nextest run --workspace --exclude js-sandbox --features integration-model --success-output final 2>&1 | tee tier3-output.log

      # Second layer of the same guard: even with the model staged and
      # GECKO_SMOKE_MODEL_DIR set, defensively fail if any real-model test
      # still reports it skipped (e.g. a staged-but-unloadable model) rather
      # than let it pass green having asserted nothing.
      - name: Guard — a skipped Tier-3 assertion must fail this job
        run: |
          set -euo pipefail
          if grep -q -- "— skipping" tier3-output.log; then
            echo "::error::A Tier-3 real-model test reported GECKO_SMOKE_MODEL_DIR unset and skipped."
            echo "::error::That must never happen in this nightly/manual job — failing instead of false-passing."
            grep -- "— skipping" tier3-output.log
            exit 1
          fi
          echo "OK: no Tier-3 test skipped."
