name: Release

# Per-platform GitHub Release binaries (plan P6). Each target builds `cargo
# build --release --features real-embedder --bin gecko` — the WORKING candle
# embedder ships inside the binary — but this NEVER downloads the 1.3GB
# embedding model: candle is a compile-time dependency, the model is a
# runtime asset staged separately via `gecko model fetch` (P2) on first use.
# TypeDB is likewise never bundled: `orchestrated` mode (P3) fetches the
# pinned server into the local cache on first `gecko up`. The packaged
# artifact therefore contains ONLY the `gecko` binary and is tens of MB
# (candle links in statically, but no model bytes are ever written into the
# build tree or the release archive) — no strip/upx tricks, just the normal
# `--release` profile already configured in the workspace Cargo.toml.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version string to embed in asset filenames (e.g. "v0.1.0"). Only
          needed for a manual run that isn't triggered by a tag/release;
          defaults to the triggering ref name.
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # required to upload assets to a GitHub Release
  id-token: write # OIDC token for build-provenance attestation
  attestations: write # record the provenance attestation

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            archive: zip
          - target: x86_64-apple-darwin
            # Built by CROSS-COMPILING from the FREE arm64 macos-14 runner
            # (`--target x86_64-apple-darwin`) rather than a PAID Intel
            # "-large" hosted runner. Validated locally on aarch64-apple-darwin:
            # `cargo build --target x86_64-apple-darwin --release --features
            # real-embedder --bin gecko` links candle statically and produces
            # a working x86_64 Mach-O binary with no extra system deps. The
            # dtolnay/rust-toolchain step below installs the target via
            # `targets: ${{ matrix.target }}`, and every job (incl. the native
            # aarch64 one) already builds with `--target ${{ matrix.target }}`,
            # so the packaging step reads target/<triple>/release/gecko
            # uniformly for both native and cross builds.
            os: macos-14
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          key: release-${{ matrix.target }}

      # Excludes js-sandbox to match the CI build boundary (plan P5); packages
      # only the `gecko` binary (`--bin gecko`). `real-embedder` compiles
      # candle into the binary so the shipped release has a WORKING embedder
      # out of the box — it does not touch the model cache or fetch anything.
      - name: Build release binary (real-embedder; compiles candle, fetches no model)
        run: cargo build --release --features real-embedder --bin gecko --target ${{ matrix.target }}

      # Package ONLY the gecko binary — never the model (~1.3GB, fetched at
      # runtime via `gecko model fetch`) and never TypeDB (fetched at runtime
      # by `gecko up` in orchestrated mode). The resulting archive is tens of
      # MB: candle statically linked, zero model bytes.
      - name: Package (binary only — no model, no TypeDB)
        id: package
        shell: bash
        env:
          # Piped through env (not interpolated directly into the script) —
          # this is workflow_dispatch operator input, but never trust
          # untyped strings inside a `run:` block regardless of trigger.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME:-dev}}"
          name="gecko-${version}-${{ matrix.target }}"
          bin_dir="target/${{ matrix.target }}/release"

          stage_root="$RUNNER_TEMP/stage"
          stage_dir="$stage_root/$name"
          mkdir -p "$stage_dir"
          cp "$bin_dir/gecko" "$stage_dir/gecko"
          chmod +x "$stage_dir/gecko"

          # Sanity guard: fail loudly rather than silently ship an oversized
          # (possibly model-contaminated) asset. A real-embedder release
          # binary is expected to be well under 500MB; the 1.3GB model would
          # blow past this immediately if it were ever accidentally staged
          # alongside the binary.
          size_bytes=$(wc -c < "$stage_dir/gecko")
          max_bytes=$((500 * 1024 * 1024))
          if [ "$size_bytes" -gt "$max_bytes" ]; then
            echo "::error::gecko binary is ${size_bytes} bytes — exceeds the ${max_bytes} byte sanity ceiling. Refusing to package (possible model contamination)."
            exit 1
          fi

          cd "$stage_root"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            asset="$name.zip"
            zip -r "$asset" "$name"
          else
            asset="$name.tar.gz"
            tar -czf "$asset" "$name"
          fi
          mv "$asset" "$GITHUB_WORKSPACE/$asset"

          # Checksum for download verification (shasum is present on both the
          # macOS and Ubuntu runners). Written next to the asset so a consumer can
          # `shasum -a 256 -c <asset>.sha256`.
          ( cd "$GITHUB_WORKSPACE" && shasum -a 256 "$asset" > "$asset.sha256" )

          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "checksum=$asset.sha256" >> "$GITHUB_OUTPUT"
          echo "Packaged $asset ($(wc -c < "$GITHUB_WORKSPACE/$asset") bytes) containing only the gecko binary."
          echo "Checksum: $(cat "$GITHUB_WORKSPACE/$asset.sha256")"

      # Cryptographic provenance: attests that this exact artifact was built by
      # this workflow from this commit (verifiable with `gh attestation verify`).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ steps.package.outputs.asset }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # On a manual workflow_dispatch run (no tag/release event), default
          # to github.ref_name would tag the release after the branch (e.g.
          # "main") while the asset filename still embeds `inputs.version` —
          # a mismatched tag/asset pair. Pin the release tag to the same
          # version used to name the packaged asset above. On the normal
          # tag-push / release-published paths `inputs.version` is empty, so
          # this falls through to github.ref_name (the pushed tag) unchanged.
          tag_name: ${{ inputs.version || github.ref_name }}
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.checksum }}
          fail_on_unmatched_files: true
          draft: false
