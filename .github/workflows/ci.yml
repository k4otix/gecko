name: CI

# Tier 1 (lib/bins, serviceless) + Tier 2 (real TypeDB service, stub embedder).
# Runs on every push/PR to main. MUST stay candle-free and model-free: the
# per-push job never compiles candle and never touches ~/.cache/gecko/models
# (plan P5). The 1.3GB real-model path lives ONLY in model-integration.yml.
on:
  # `labeled` is included so applying the `tier3-validated` label re-runs the
  # model-bump-gate and can actually flip it green (the gate reads the label from
  # the PR event payload; without this, a label added after the fact is never seen
  # until the next push).
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Least privilege: the default GITHUB_TOKEN is read-only. No job here writes to
# the repo, so nothing needs to elevate.
permissions:
  contents: read

jobs:
  # Plan P5's one accepted tradeoff, enforced: a change to the pinned embedding
  # model (model_id in gecko-bin/src/config.rs, or MODEL_REVISION in
  # model-integration.yml) is NOT validated by this per-push job (it never runs
  # the real model). It requires a manual Tier-3 run
  # (workflow_dispatch on model-integration.yml) BEFORE merge — this job fails
  # loudly on a detected bump unless the PR carries the `tier3-validated` label,
  # so the rule is explicit and hard to bypass silently. To be load-bearing this
  # job must be added as a required status check in branch protection.
  model-bump-gate:
    name: Model revision bump gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect a model_id / MODEL_REVISION change
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CONFIG_DIFF="$(git diff -U10 "$BASE_SHA" "$HEAD_SHA" -- gecko-bin/src/config.rs || true)"
          WORKFLOW_DIFF="$(git diff "$BASE_SHA" "$HEAD_SHA" -- .github/workflows/model-integration.yml || true)"

          # Token-adjacency hits: direct references to model_id / default_model_id.
          CONFIG_TOKEN_HITS="$(printf '%s\n' "$CONFIG_DIFF" | grep -E '^[+-].*(default_model_id|model_id\s*[:=])' || true)"
          # Literal-model hits: a bump can slip through the token check above by
          # touching only the pinned `"bge-large-en-v1.5@<revision>"` literal
          # returned by default_model_id() (e.g. its body changes but the line
          # itself doesn't mention `model_id`) — catch that string directly.
          CONFIG_LITERAL_HITS="$(printf '%s\n' "$CONFIG_DIFF" | grep -E '^[+-].*bge-large-en-v1\.5@' || true)"
          # Function-region hits: any changed line inside a diff hunk whose
          # context includes `fn default_model_id`, so an edit anywhere in that
          # function's body can't slip through by avoiding every recognized token.
          CONFIG_FN_REGION_HITS="$(printf '%s\n' "$CONFIG_DIFF" | awk '
            /^@@/ { hunk = $0 "\n"; in_hunk = 1; has_fn = 0; next }
            in_hunk { hunk = hunk $0 "\n" }
            in_hunk && /fn default_model_id/ { has_fn = 1 }
            /^(diff|--- |\+\+\+ )/ { if (in_hunk && has_fn) print hunk; in_hunk = 0 }
            END { if (in_hunk && has_fn) print hunk }
          ' || true)"

          # Workflow side: the pinned MODEL_REVISION/MODEL_ID env values, or the
          # literal model string wherever it appears (e.g. in a comment example).
          WORKFLOW_HITS="$(printf '%s\n' "$WORKFLOW_DIFF" | grep -E '^[+-].*(MODEL_REVISION|MODEL_ID\s*:|bge-large-en-v1\.5@)' || true)"

          CHANGED="$(printf '%s\n%s\n%s\n%s\n' "$CONFIG_TOKEN_HITS" "$CONFIG_LITERAL_HITS" "$CONFIG_FN_REGION_HITS" "$WORKFLOW_HITS" | sed '/^$/d')"
          if [ -n "$CHANGED" ]; then
            echo "Detected a model_id/MODEL_REVISION change:"
            echo "$CHANGED"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the tier3-validated label before merging a model bump
        if: steps.diff.outputs.bumped == 'true' && !contains(github.event.pull_request.labels.*.name, 'tier3-validated')
        run: |
          echo "::error::This PR changes the pinned embedding model (model_id / MODEL_REVISION)."
          echo "::error::Rule (plan P5): a model_id/MODEL_REVISION bump requires a manual Tier-3"
          echo "::error::run (workflow_dispatch on .github/workflows/model-integration.yml) BEFORE"
          echo "::error::merge — otherwise a model regression is caught by nightly, not this PR."
          echo "::error::After Tier-3 is green, add the 'tier3-validated' label to unblock this check."
          exit 1

  build-and-test:
    name: Build + test (Tier 1+2, candle-free, cyber-on)
    runs-on: ubuntu-latest

    # Pinned (not :latest) so the per-push job is reproducible; the runner
    # caches this layer across runs.
    services:
      typedb:
        image: typedb/typedb:3.12.0
        ports:
          - 1729:1729

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install nextest, cargo-audit, cargo-deny
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2
        with:
          tool: nextest,cargo-audit,cargo-deny

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Cargo Audit
        run: cargo audit

      # License, source, and duplicate-dependency checks over the full lock graph
      # (advisories are covered by cargo audit above). Config: deny.toml.
      - name: Run cargo-deny
        run: cargo deny check licenses bans sources

      # Gating (P7 cleared the clippy backlog): a regression here now fails the
      # build, not just shows up in the log.
      - name: Clippy (candle-free)
        run: cargo clippy --workspace --exclude js-sandbox --no-default-features --locked -- -D warnings

      - name: Clippy (candle-free, cyber)
        run: cargo clippy --workspace --exclude js-sandbox --no-default-features --features cyber --locked -- -D warnings

      # Structural guard: this job must NEVER compile candle. `--no-default-
      # features` drops `real-embedder` (default-on since P4), so candle should
      # not appear anywhere in this dependency graph. Fail loudly if it does —
      # that would mean the per-push job silently started paying the candle
      # compile cost (and, via auto_fetch, could reach for the 1.3GB model).
      - name: Guard — no candle in the candle-free build
        run: |
          set -euo pipefail
          if cargo tree --workspace --exclude js-sandbox --no-default-features | grep -qi candle; then
            echo "::error::candle appears in the --no-default-features dependency tree — the per-push job must stay candle-free (plan P4/P5)."
            exit 1
          fi
          echo "OK: no candle in the --no-default-features tree."

      # ONE candle-free command covers Tier 1 (--lib/--bins, serviceless) + Tier
      # 2 (tests/, against the real TypeDB service above, stub embedder) +
      # the cyber-entity schema-init assertion (needs `--features cyber`).
      # `real-embedder` is OFF here (no-default-features), so this never
      # compiles candle and never touches ~/.cache/gecko/models.
      - name: Test (Tier 1 + Tier 2, candle-free, cyber-on)
        run: cargo nextest run --workspace --exclude js-sandbox --no-default-features --features cyber --locked

      # Sanity check: the model-free per-push job must never have populated the
      # runtime model cache. The compiled feature boundary (P4) guarantees this
      # structurally; this step just makes it observable in the logs.
      - name: Guard — no model cache materialized
        run: |
          set -euo pipefail
          DIR="$HOME/.cache/gecko/models"
          if [ -d "$DIR" ] && [ -n "$(ls -A "$DIR" 2>/dev/null)" ]; then
            echo "::error::$DIR is non-empty — the candle-free per-push job must never populate the model cache."
            exit 1
          fi
          echo "OK: no model cache directory materialized."

  # Compile-checks the candle-backed real-embedder surface, which the candle-free
  # build-and-test job never builds. Without this, a dependency bump that only
  # affects the `real-embedder` path (candle, tokenizers) would pass CI green
  # having compiled none of it. This is a `cargo check` (no run, no TypeDB, and no
  # model download — the model is a runtime asset), so it stays fast.
  real-embedder-check:
    name: Compile check (real-embedder, candle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: real-embedder

      - name: cargo check (real-embedder)
        run: cargo check --workspace --exclude js-sandbox --features real-embedder --locked
