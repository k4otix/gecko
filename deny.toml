# cargo-deny configuration. CI runs `cargo deny check` (see ci.yml). Advisories
# are also covered by `cargo audit`; this adds license, bans, and source checks.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses accepted for dependencies. Add to this list (with a note)
# rather than loosening the confidence threshold.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    # webpki-roots ships Mozilla's CA certificate data under this permissive
    # data license.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are a warning, not an error — a large graph (candle, typedb)
# routinely carries a few, and failing CI on them would be noise.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
