[workspace]
resolver = "2"
members = [
    "core/gecko-engine", "core/gecko-extension-api", "core/js-sandbox",
    "core/mem-gecko",
    "extensions/cyber-gecko",
    "gecko-bin",
]
default-members = [
    "core/gecko-engine",
    "core/gecko-extension-api",
    "core/mem-gecko",
    "extensions/cyber-gecko",
    "gecko-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/k4otix/gecko"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"

# TypeDB — 3.12+ required for parameterized `given` queries (query_with_rows)
typedb-driver = "3.12"

# Markdown / text processing
pulldown-cmark = "0.13"
regex = "1"

# Hashing
sha2 = "0.11"

# Identity
uuid = { version = "1", features = ["v4"] }

# Dates
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3
