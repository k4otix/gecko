[package]
name = "mem-gecko"
description = "GECKO cognitive memory substrate: GraphRAG episodic memory, execution episodes, and learned constraints. Always-on trusted base — housed in core/, not extensions/."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gecko-extension-api = { path = "../gecko-extension-api" }
serde_json.workspace = true
chrono = { workspace = true }
async-trait = "0.1"
ulid = "3"
futures-util = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }
# Live schema-acceptance integration tests reuse the engine's TypeDB router to
# drive raw parameterized TQL against a throwaway database.
gecko-engine = { path = "../gecko-engine" }
# The concrete HNSW accelerator, used to drive the real index through the writer in
# the recall/rebuild integration tests. The load-bearing constraint on mem's
# production deps is that none is gecko-engine (no cycle: the engine owns the driver,
# mem owns its TQL).
gecko-semantic-index = { path = "../gecko-semantic-index" }
typedb-driver = { workspace = true }
