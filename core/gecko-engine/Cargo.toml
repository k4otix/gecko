[package]
name = "gecko-engine"
description = "GECKO core engine: OKF parser, TypeDB router, sandbox, and orchestration pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
integration = []  # Gate integration tests requiring live TypeDB

[dependencies]
gecko-extension-api = { path = "../gecko-extension-api" }
async-trait = "0.1"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
typedb-driver = { workspace = true }
pulldown-cmark = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
futures-util = "0.3.32"
wasmtime = "46.0.1"
wasmtime-wasi = "46.0.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util", "macros"] }
