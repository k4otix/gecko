[package]
name = "gecko-bin"
description = "GECKO CLI assembler: wires extensions into the core engine and provides the command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gecko"
path = "src/main.rs"

[dependencies]
gecko-engine = { path = "../core/gecko-engine" }
cyber-gecko = { path = "../extensions/cyber-gecko" }
mem-gecko = { path = "../extensions/mem-gecko" }

tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures-util = "0.3.32"
typedb-driver.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
uuid = { workspace = true, features = ["v4"] }
